<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0c0d">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="{{ page.description | escape }}">
    <title>{{ page.title }}</title>
    <style>html{background:#0b0c0d;color:#f4f4f2}</style>
    <link rel="icon" type="image/png" href="{{ '/assets/images/gitextensionsmac/app-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/gitextensionsmac.css' | relative_url }}">
  </head>
  <body class="gem gem--{{ page.page_kind | default: 'page' }}">
    <header class="gem-header">
      <div class="gem-container gem-header-inner">
        <a class="gem-brand" href="{{ '/gitextensionsmac/' | relative_url }}">
          <img src="{{ '/assets/images/gitextensionsmac/app-icon.png' | relative_url }}" width="34" height="34" alt="">
          <span>GitExtensionsMac</span>
        </a>
        <nav aria-label="GitExtensionsMac navigation">
          <a href="https://github.com/norgera/GitExtensionsMac">GitHub</a>
          <a class="gem-download-small" href="https://github.com/norgera/GitExtensionsMac/releases/latest">Releases</a>
        </nav>
      </div>
    </header>

    <main class="gem-container">
      {{ content }}
    </main>

    <footer class="gem-footer">
      <div class="gem-container gem-footer-inner">
        <span>GitExtensionsMac by Nathan Orgera</span>
        <nav aria-label="Legal navigation">
          <a href="{{ '/gitextensionsmac/privacy/' | relative_url }}">Privacy</a>
          <a href="{{ '/gitextensionsmac/terms/' | relative_url }}">Terms</a>
          <a href="{{ '/' | relative_url }}">nate's site</a>
        </nav>
      </div>
    </footer>
    <script src="{{ '/assets/js/gitextensionsmac.js' | relative_url }}" defer></script>
  </body>
</html>
